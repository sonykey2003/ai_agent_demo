# Reused from the golden demo's "healthcare" domain (data/eval-facing).
# Knowledge lives in docs/qa.csv; datasets here are for Galileo eval and
# context-adherence / coherence baselining.

domain:
  name: "healthcare"
  description: "Healthcare assistant for online help and patient information support"

galileo:
  project: "shawn-otel-demo"
  log_stream: "healthcare"

model:
  default_provider: "local"
  temperature: 0.1

rag:
  enabled: true
  knowledge_dir: "domains/healthcare/docs"
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 3

vectorstore:
  embedding_model: "nomic-embed-text"
  collection: "ai_agent_demo_healthcare"

dataset:
  qa: "domains/healthcare/docs/qa.csv"
  csv: "domains/healthcare/dataset.csv"
  jsonl: "domains/healthcare/dataset.jsonl"
  input_column: "input"
  output_column: "output"
