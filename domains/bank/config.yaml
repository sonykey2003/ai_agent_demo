# Reused from the golden demo's "bank" domain (data/eval-facing).
# Knowledge lives in docs/qa.csv; datasets here are for Galileo eval and
# context-adherence / coherence baselining.

domain:
  name: "bank"
  description: "Bank assistant for online help and customer account support"

galileo:
  project: "shawn-otel-demo"
  log_stream: "bank"

model:
  default_provider: "local"
  temperature: 0.1

rag:
  enabled: true
  knowledge_dir: "domains/bank/docs"
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 3

vectorstore:
  embedding_model: "nomic-embed-text"
  collection: "ai_agent_demo_bank"

dataset:
  qa: "domains/bank/docs/qa.csv"
  csv: "domains/bank/dataset.csv"
  jsonl: "domains/bank/dataset.jsonl"
  input_column: "input"
  output_column: "output"
