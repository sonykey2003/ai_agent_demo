<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Agent Chat — Observability Demo</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1c2330;
        --border: #2d333b;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #2f81f7;
        --user: #1f6feb;
        --tool: #8957e5;
        --guard: #d29922;
        --error: #f85149;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1100px 520px at 50% -8%, #122339, #07090d);
        color: var(--text);
        height: 100vh;
        padding: 24px;
      }
      .app {
        display: flex; flex-direction: column;
        width: 100%; max-width: 880px; height: 100%;
        margin: 0 auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .topbar {
        display: flex; align-items: center; gap: 10px;
        padding: 16px 22px; border-bottom: 1px solid var(--border); background: var(--panel);
      }
      .brand { font-weight: 600; font-size: 16px; }
      .brand span { color: var(--muted); font-weight: 400; font-size: 12px; }

      .body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      .app.empty .body { justify-content: center; }

      .hero { text-align: center; padding: 0 24px 24px; }
      .hero h1 { font-size: 27px; font-weight: 600; margin: 0; }
      .hero p { color: var(--muted); margin: 10px 0 0; font-size: 14px; }
      .app:not(.empty) .hero { display: none; }

      #messages { flex: 1; overflow-y: auto; padding: 24px 22px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
      .app.empty #messages { display: none; }
      .msg { display: flex; }
      .msg.user { justify-content: flex-end; }
      .bubble {
        max-width: 82%; padding: 14px 18px; border-radius: 16px; line-height: 1.55;
        white-space: pre-wrap; word-wrap: break-word; font-size: 16px;
      }
      .msg.user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
      .msg.assistant .bubble { background: var(--panel-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
      .notice {
        align-self: center; font-size: 12px; padding: 4px 10px; border-radius: 999px;
        border: 1px solid var(--border); color: var(--muted); background: var(--panel);
      }
      .notice.tool { color: #c8a6ff; border-color: var(--tool); }
      .notice.guard { color: #f2cc60; border-color: var(--guard); }
      .notice.error { color: #ff7b72; border-color: var(--error); }

      .composer-wrap { padding: 14px 22px 20px; }
      .app.empty .composer-wrap { padding-top: 0; }
      .composer {
        background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 22px; padding: 10px 12px 8px;
        display: flex; flex-direction: column; gap: 6px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.28);
      }
      .composer:focus-within { border-color: var(--accent); }
      .composer textarea {
        width: 100%; resize: none; border: 0; outline: none; background: transparent;
        color: var(--text); font-size: 16px; line-height: 1.5; font-family: inherit;
        max-height: 200px; padding: 6px 8px 0;
      }
      .composer textarea::placeholder { color: var(--muted); }
      .composer-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 2px; }
      .composer-bar .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .composer-bar .model { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      .composer select {
        background: var(--panel); color: var(--text); border: 1px solid var(--border);
        border-radius: 999px; padding: 6px 10px; font-size: 12px; cursor: pointer; outline: none;
      }
      .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
      .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
      .switch .track { width: 34px; height: 18px; border-radius: 999px; background: var(--border); transition: background 0.15s; position: relative; flex: none; }
      .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
      .switch input:checked + .track { background: var(--guard); }
      .switch input:checked + .track::after { transform: translateX(16px); }
      .switch input:focus-visible + .track { box-shadow: 0 0 0 2px var(--accent); }
      .send {
        width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
        background: var(--accent); color: #fff; font-size: 17px; line-height: 1;
        display: flex; align-items: center; justify-content: center;
      }
      .send:disabled { opacity: 0.45; cursor: default; }

      .attach {
        width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer;
        background: var(--panel); color: var(--text); font-size: 15px; line-height: 1;
        display: flex; align-items: center; justify-content: center; flex: none;
      }
      .attach:hover { border-color: var(--accent); }
      .composer.dragging { border-color: var(--accent); border-style: dashed; background: #17243a; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 6px 0; }
      .chips:empty { display: none; }
      .chip {
        position: relative; display: flex; align-items: center; gap: 8px; max-width: 260px;
        background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
        padding: 6px 28px 6px 6px; overflow: hidden; font-size: 12px;
      }
      .chip.error { border-color: var(--error); }
      .chip .thumb {
        width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: none;
        background: var(--panel-2); display: flex; align-items: center; justify-content: center; font-size: 20px;
      }
      .chip .info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .chip .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
      .chip .meta { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .chip.error .meta { color: #ff7b72; white-space: normal; }
      .chip .badge { color: #f2cc60; }
      .chip .remove {
        position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%;
        border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1;
      }
      .chip .remove:hover { color: var(--text); background: var(--border); }
      .chip .progress { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); transition: width 0.15s; }
      .chip.processing .progress { width: 100% !important; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

      .bubble .files { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; margin-bottom: 8px; }
      .bubble .files:last-child { margin-bottom: 0; }
      .bubble .files img { max-width: 180px; max-height: 140px; border-radius: 10px; display: block; }
      .bubble .files .doc {
        background: rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 6px 10px; font-size: 13px;
      }
      .notice.file { color: #9ecbff; border-color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="app empty" id="app">
      <div class="topbar">
        <div class="brand">🛰️ Agent Chat <span>· vendor-agnostic observability demo</span></div>
      </div>
      <div class="body">
        <div id="messages"></div>
        <div class="hero">
          <h1>Ready when you are.</h1>
          <p>Ask the agent anything — choose a model below. Attach documents or pictures with 📎.</p>
        </div>
        <div class="composer-wrap">
          <form class="composer" id="composer" autocomplete="off">
            <div class="chips" id="chips"></div>
            <textarea id="input" rows="1" placeholder="Ask the agent… (attach files or images with 📎, drag-and-drop, or paste)"></textarea>
            <div class="composer-bar">
              <div class="controls">
                <button class="attach" id="attach" type="button" title="Attach files or images">📎</button>
                <input type="file" id="file-input" multiple hidden />
                <label class="model">Model
                  <select id="provider"></select>
                </label>
                <label class="model">Domain
                  <select id="domain"></select>
                </label>
              </div>
              <button class="send" id="send" type="submit" title="Send">↑</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      const appEl = document.getElementById("app");
      const messagesEl = document.getElementById("messages");
      const form = document.getElementById("composer");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const providerSel = document.getElementById("provider");
      const domainSel = document.getElementById("domain");
      const chipsEl = document.getElementById("chips");
      const fileInput = document.getElementById("file-input");
      const attachBtn = document.getElementById("attach");
      const conversationId = crypto.randomUUID
        ? crypto.randomUUID()
        : `chat-${Date.now()}-${Math.random().toString(16).slice(2)}`;

      const visionByProvider = {};
      let limits = { max_mb: 50, max_files: 4, accepted: { image: [], document: [] } };
      let pending = [];
      let busy = false;

      const IMAGE_TYPES = ["image/png", "image/jpeg", "image/webp"];
      const isImageFile = (f) => IMAGE_TYPES.includes(f.type) || /\.(png|jpe?g|webp)$/i.test(f.name);
      const selectedSeesImages = () => visionByProvider[providerSel.value] !== false;

      function formatSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      }

      function readyMeta(d) {
        const ocr = d.ocr;
        if (d.kind === "image") {
          if (!ocr) return "image";
          return ocr.lines ? `🔤 ${ocr.lines} lines recognized` : "no text recognized";
        }
        const parts = [];
        if (d.pages) parts.push(d.pages + (d.pages === 1 ? " page" : " pages"));
        if (ocr && ocr.pages) parts.push(`${ocr.pages} OCR'd`);
        parts.push(d.chars.toLocaleString() + " chars");
        return parts.join(" · ");
      }

      function renderChips() {
        chipsEl.innerHTML = "";
        for (const item of pending) {
          const chip = document.createElement("div");
          chip.className = "chip " + item.status;
          const thumb = item.previewUrl ? document.createElement("img") : document.createElement("div");
          thumb.className = "thumb";
          if (item.previewUrl) thumb.src = item.previewUrl;
          else thumb.textContent = "📄";
          const info = document.createElement("div");
          info.className = "info";
          const name = document.createElement("div");
          name.className = "name";
          name.textContent = item.file.name;
          name.title = item.file.name;
          const meta = document.createElement("div");
          meta.className = "meta";
          if (item.status === "uploading") meta.textContent = `uploading ${item.progress}% · ${formatSize(item.file.size)}`;
          else if (item.status === "processing") meta.textContent = item.isImage || /\.pdf$/i.test(item.file.name) ? "recognizing text…" : "processing…";
          else if (item.status === "error") meta.textContent = item.error;
          else meta.textContent = readyMeta(item.descriptor);
          if (item.isImage && item.status !== "error" && !selectedSeesImages()) {
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = " · 🔤 text only";
            meta.appendChild(badge);
            chip.title = "This model can't see images — it will get the recognized text.";
          }
          info.append(name, meta);
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "remove";
          remove.textContent = "×";
          remove.title = "Remove";
          remove.addEventListener("click", () => removeItem(item));
          chip.append(thumb, info, remove);
          if (item.status === "uploading" || item.status === "processing") {
            const bar = document.createElement("div");
            bar.className = "progress";
            bar.style.width = item.progress + "%";
            chip.appendChild(bar);
          }
          chipsEl.appendChild(chip);
        }
        updateSend();
      }

      function updateSend() {
        const inFlight = pending.some((i) => i.status === "uploading" || i.status === "processing");
        const ready = pending.some((i) => i.status === "ready");
        sendBtn.disabled = busy || inFlight || (!input.value.trim() && !ready);
      }

      function removeItem(item) {
        if (item.xhr && item.status !== "ready") item.xhr.abort();
        if (item.status === "ready") {
          fetch(`/attachments/${item.descriptor.id}?conversation_id=${encodeURIComponent(conversationId)}`, { method: "DELETE" }).catch(() => {});
        }
        if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
        pending = pending.filter((i) => i !== item);
        renderChips();
      }

      function addFiles(files) {
        for (const file of files) {
          const active = pending.filter((i) => i.status !== "error").length;
          const item = { file, status: "uploading", progress: 0, isImage: isImageFile(file) };
          if (item.isImage) item.previewUrl = URL.createObjectURL(file);
          pending.push(item);
          if (active >= limits.max_files) {
            item.status = "error";
            item.error = `Attach at most ${limits.max_files} files per message.`;
          } else if (file.size > limits.max_mb * 1024 * 1024) {
            item.status = "error";
            item.error = `Larger than ${limits.max_mb} MB (${formatSize(file.size)}).`;
          } else {
            upload(item);
          }
        }
        renderChips();
      }

      function upload(item) {
        const form = new FormData();
        form.append("conversation_id", conversationId);
        form.append("file", item.file, item.file.name);
        const xhr = new XMLHttpRequest();
        item.xhr = xhr;
        xhr.open("POST", "/attachments");
        xhr.upload.onprogress = (e) => {
          if (!e.lengthComputable) return;
          item.progress = Math.round((e.loaded / e.total) * 100);
          renderChips();
        };
        xhr.upload.onload = () => { item.status = "processing"; renderChips(); };
        xhr.onload = () => {
          let body = {};
          try { body = JSON.parse(xhr.responseText); } catch {}
          if (xhr.status === 200) { item.status = "ready"; item.descriptor = body; }
          else { item.status = "error"; item.error = body.error || `Upload failed (${xhr.status}).`; }
          renderChips();
        };
        xhr.onerror = () => { item.status = "error"; item.error = "Upload failed (network error)."; renderChips(); };
        xhr.send(form);
      }

      attachBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => { addFiles([...fileInput.files]); fileInput.value = ""; });
      input.addEventListener("paste", (e) => {
        const files = [...(e.clipboardData?.files || [])];
        if (files.length) { e.preventDefault(); addFiles(files); }
      });
      let dragDepth = 0;
      appEl.addEventListener("dragenter", (e) => {
        if (![...e.dataTransfer.types].includes("Files")) return;
        e.preventDefault(); dragDepth++; form.classList.add("dragging");
      });
      appEl.addEventListener("dragover", (e) => { if ([...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
      appEl.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; form.classList.remove("dragging"); } });
      appEl.addEventListener("drop", (e) => {
        e.preventDefault(); dragDepth = 0; form.classList.remove("dragging");
        addFiles([...e.dataTransfer.files]);
      });

      async function loadLimits() {
        try {
          limits = await (await fetch("/attachments/limits")).json();
          fileInput.accept = [...limits.accepted.image, ...limits.accepted.document].join(",");
        } catch (e) {
          console.error("could not load attachment limits", e);
        }
      }

      function autoGrow() {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 200) + "px";
      }
      input.addEventListener("input", () => { autoGrow(); updateSend(); });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
      });

      // Remember the last Model/Domain choice across reloads; when nothing is
      // stored, fall back to a demo-friendly default, then the server default.
      function selectValue(sel, storageKey, preferred, serverDefault) {
        const saved = localStorage.getItem(storageKey);
        const exists = (v) => v && [...sel.options].some((o) => o.value === v);
        const val = [saved, preferred, serverDefault].find(exists);
        if (val) sel.value = val;
      }
      providerSel.addEventListener("change", () => { localStorage.setItem("ui.provider", providerSel.value); renderChips(); });
      domainSel.addEventListener("change", () => localStorage.setItem("ui.domain", domainSel.value));

      async function loadProviders() {
        try {
          const res = await fetch("/providers");
          const data = await res.json();
          for (const p of data.providers) {
            visionByProvider[p.id] = Boolean(p.supports_vision);
            const opt = document.createElement("option");
            opt.value = p.id;
            opt.textContent = p.supports_vision ? `${p.label} · 👁 vision` : p.label;
            providerSel.appendChild(opt);
          }
          selectValue(providerSel, "ui.provider", "openai", data.default);
          renderChips();
        } catch (e) {
          console.error("could not load providers", e);
        }
      }

      async function loadDomains() {
        try {
          const res = await fetch("/domains");
          const data = await res.json();
          for (const d of data.domains) {
            const opt = document.createElement("option");
            opt.value = d.id;
            opt.textContent = d.label;
            domainSel.appendChild(opt);
          }
          selectValue(domainSel, "ui.domain", "bank", data.default);
        } catch (e) {
          console.error("could not load domains", e);
        }
      }

      function addMessage(role) {
        const wrap = document.createElement("div");
        wrap.className = "msg " + role;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return bubble;
      }

      function addNotice(text, kind) {
        const n = document.createElement("div");
        n.className = "notice " + (kind || "");
        n.textContent = text;
        messagesEl.appendChild(n);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function attachmentNotice(evt) {
        for (const item of evt.items) {
          if (item.delivery === "image+ocr") {
            const ocr = item.ocr && item.ocr.lines ? ` + ${item.ocr.lines} lines of recognized text` : "";
            addNotice(`🖼️ ${item.name} → ${evt.model} (image${ocr})`, "file");
          } else if (item.delivery === "ocr_only") {
            addNotice(`🔤 ${item.name} → recognized text only (${evt.model} can't see images)`, "guard");
          } else {
            const parts = [`📎 ${item.name}`];
            if (item.pages) parts.push(item.pages + (item.pages === 1 ? " page" : " pages"));
            if (item.ocr && item.ocr.pages) parts.push(`${item.ocr.pages} pages OCR'd`);
            parts.push(item.chars.toLocaleString() + " chars");
            if (item.truncated) parts.push("truncated to fit the prompt");
            addNotice(parts.join(" · "), "file");
          }
        }
      }

      function renderUserBubble(text, items) {
        const bubble = addMessage("user");
        if (items.length) {
          const files = document.createElement("div");
          files.className = "files";
          for (const item of items) {
            if (item.previewUrl) {
              const img = document.createElement("img");
              img.src = item.previewUrl;
              img.alt = item.file.name;
              img.title = item.file.name;
              files.appendChild(img);
            } else {
              const doc = document.createElement("div");
              doc.className = "doc";
              doc.textContent = "📄 " + item.file.name;
              files.appendChild(doc);
            }
          }
          bubble.appendChild(files);
        }
        if (text) bubble.appendChild(document.createTextNode(text));
      }

      async function send(text, items) {
        renderUserBubble(text, items);
        const bubble = addMessage("assistant");
        let acc = "";

        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            provider: providerSel.value,
            domain: domainSel.value,
            conversation_id: conversationId,
            attachments: items.map((i) => i.descriptor.id),
          }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf("\n\n")) >= 0) {
            const raw = buf.slice(0, idx).trim();
            buf = buf.slice(idx + 2);
            if (!raw.startsWith("data:")) continue;
            let evt;
            try { evt = JSON.parse(raw.slice(5).trim()); } catch { continue; }
            if (evt.type === "token") { acc += evt.text; bubble.textContent = acc; }
            else if (evt.type === "meta") addNotice("📚 grounding on domain: " + evt.domain + " · " + evt.collection);
            else if (evt.type === "attachments") attachmentNotice(evt);
            else if (evt.type === "tool") addNotice("🔧 tool · " + evt.name, "tool");
            else if (evt.type === "guardrail") { addNotice("🛡️ blocked (" + evt.stage + ") · Galileo Agent Control: " + evt.reason, "guard"); }
            else if (evt.type === "redacted") { bubble.textContent = evt.text; const verb = evt.action === "steer" ? (evt.revised ? "revised (steer)" : "withheld (steer, no revision)") : evt.action === "deny" ? "withheld (deny)" : evt.action; const lbl = evt.control ? "🛡️ output " + verb + " by Galileo Agent Control · " + evt.control : "🛡️ output withheld by Galileo Agent Control"; addNotice(lbl, "guard"); }
            else if (evt.type === "error") addNotice("⚠️ " + evt.message, "error");
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        const items = pending.filter((i) => i.status === "ready");
        if (sendBtn.disabled || (!text && !items.length)) return;
        appEl.classList.remove("empty");
        input.value = "";
        autoGrow();
        // Sent chips move into the user bubble; failed ones are dropped.
        pending = [];
        renderChips();
        busy = true;
        updateSend();
        try { await send(text, items); }
        catch (err) { addNotice("⚠️ " + err.message, "error"); }
        finally { busy = false; updateSend(); input.focus(); }
      });

      loadProviders();
      loadDomains();
      loadLimits();
      updateSend();
      input.focus();
    </script>
  </body>
</html>
